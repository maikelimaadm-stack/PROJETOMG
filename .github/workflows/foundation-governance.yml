name: Foundation Governance

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
    branches:
      - main
      - cursor/**

jobs:
  foundation:
    name: Build · Lint · Typecheck · Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --omit=dev
        working-directory: backend

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # P1-02B — o typecheck deixou de ser auditoria e passou a ser enforcement.
      # O nome anterior deste step ("governance audit — TD-009 baseline") descrevia uma
      # ponte permissiva que devolvia 0 diante de qualquer erro, atribuindo a dívida a
      # uma causa que a medição refutou. Os três steps abaixo substituem aquele único.

      # 1. O ESCOPO continua o que P1-02A definiu: produção, sem os testes.
      - name: Typecheck scope governance tests
        run: npm run test:typecheck-scope-governance

      # 2. O ENFORCEMENT em si é testado antes de ser confiado: parsing, validação da
      #    baseline e a reprovação nos dois sentidos (regressão e baseline stale).
      - name: Typecheck governance contract tests
        run: npm run test:typecheck-governance

      # 3. E só então a dívida real é comparada contra a baseline exata e versionada.
      #    Este step REPROVA: um diagnóstico novo em produção quebra o CI.
      - name: Typecheck (fail-closed legacy baseline)
        run: npm run typecheck:governance

      - name: Runtime tests
        run: npm run test:runtime

      - name: G423 core gates
        run: npm run gate:g423

      - name: Certification gates (G31-G108)
        run: npm run gate:certification

      - name: Governance gates (G109-G136)
        run: npm run gate:governance

      - name: Deploy pipeline gates (G401 + G402)
        run: npm run gate:deploy-pipeline

  capability-gates:
    name: Capability gates (${{ matrix.capability }})
    needs: foundation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capability:
          - layout-config-engine-v13
          - field-config-engine-v14
          - validation-config-engine-v16
          - formula-config-engine-v17
          - event-config-engine-v18
          - action-config-engine-v19
          - workflow-config-engine-v20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.capability }} gates
        run: npm run gate:${{ matrix.capability }}
