# DEPRECATED (RULE-DEPLOY-002): bypasses PR → CI → Railway → Smoke flow.
# Do not extend. Scheduled for removal after Program 2.3.X.1 hardening.
name: Sync main for deploy

on:
  push:
    branches:
      - cursor/table-card-style-7d24
      - main

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync integration branch with main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main cursor/table-card-style-7d24
          git checkout cursor/table-card-style-7d24
          git merge origin/main -m "chore(deploy): sync integration branch from main"
          git push origin cursor/table-card-style-7d24

      - name: Fast-forward main from integration branch
        if: github.ref == 'refs/heads/cursor/table-card-style-7d24'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main cursor/table-card-style-7d24
          git checkout main
          if git merge --ff-only origin/cursor/table-card-style-7d24; then
            git push origin main
          else
            echo "main diverged from integration branch — skipping ff-only (main wins until manual sync)."
            git merge origin/main --ff-only || true
          fi
